name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  GPUI_LINUX_DEPS: >-
    libfontconfig-dev libfreetype-dev libwayland-dev libx11-xcb-dev
    libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # version and components come from rust-toolchain.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli
      - run: cargo fmt --all --check
      - run: taplo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # Headers GPUI links against on Linux (X11/Wayland input, fonts).
      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.GPUI_LINUX_DEPS }}
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install # version and components come from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # Headers GPUI links against on Linux (X11/Wayland input, fonts).
      - name: Install GPUI system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.GPUI_LINUX_DEPS }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@master
